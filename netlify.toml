# Netlify config for the MatchupCoach STATIC frontend.
# Netlify can't run server.js (the Node API), so we PROXY every /api/* request
# to the Render backend. The browser still calls same-origin /api (api-client.js
# uses BASE = '/api'), so accounts + Google sign-in work with no CORS changes.
#
# IMPORTANT: replace the host below with YOUR actual Render service URL
# (Render dashboard → your "matchupcoach" service → the .onrender.com URL).

[build]
  publish = "."
  # Regenerate the ~9,600 static matchup guide pages + sitemap.xml from the
  # current champion data on every deploy. They are gitignored (115MB) so the
  # repo stays lean and the pages can never drift from the data they describe.
  # If this command fails the deploy fails and the previous site stays live.
  command = "node _gen_seo_pages.js"

# ALWAYS-FRESH CACHING: the app is one big HTML file + hundreds of champ-data
# scripts with no version query. Without explicit headers, browsers heuristically
# cache them for days — users kept seeing old builds after deploys ("the fix
# didn't work"). max-age=0 + must-revalidate forces a cheap ETag check on every
# load, so each deploy reaches everyone immediately (304s when nothing changed).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Clickjacking + MIME-sniffing protection for the static pages (the API
    # already sets both from server.js; Netlify sends neither by default).
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# The self-healing build stamp must never be cached — it's how a stale page
# learns a new build shipped and reloads itself.
[[headers]]
  for = "/build.txt"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Proxy the API to the Render backend (200 = rewrite/proxy, not a redirect).
[[redirects]]
  from = "/api/*"
  to = "https://matchupcoach.onrender.com/api/:splat"
  status = 200
  force = true

# Serve the app at the root URL. force = true is REQUIRED: the physical
# index.html otherwise wins and its meta-refresh hop DROPS the query string —
# which silently killed the Stripe success return (?mc_checkout=success&
# session_id=…) in production, leaving buyers dependent on webhook latency
# for their access. With the rewrite forced, the app loads at / with the
# query intact and the confirm path runs. (The app's <head> carries its own
# canonical + JSON-LD, so shadowing index.html loses nothing.)
[[redirects]]
  from = "/"
  to = "/MatchupCoach.dc.html"
  status = 200
  force = true

# Matchup deep links (/matchup/a-vs-b and /matchup/leagueoflegends/lol/a-vs-b)
# load the app, which reads the path and opens that matchup (_openFromUrl).
# Without this every shared/sitemap matchup URL 404'd on Netlify — only the
# Node server had the SPA fallback. Static files under /matchup/ still win
# (Netlify only applies a non-forced redirect when no file matches).
# App routes stay SPA: /open deep links (lane-aware and legacy lane-less) and
# old /matchup/leagueoflegends/lol/ links load the app, which opens the matchup.
[[redirects]]
  from = "/matchup/:lane/:slug/open"
  to = "/MatchupCoach.dc.html"
  status = 200
[[redirects]]
  from = "/matchup/:slug/open"
  to = "/MatchupCoach.dc.html"
  status = 200
[[redirects]]
  from = "/matchup/leagueoflegends/lol/*"
  to = "/MatchupCoach.dc.html"
  status = 200
# Legacy lane-less shared links (/matchup/a-vs-b) still load the app…
[[redirects]]
  from = "/matchup/:slug"
  to = "/MatchupCoach.dc.html"
  status = 200
# …but any other unknown matchup URL is a REAL 404 now. Without this, every
# nonexistent guide URL soft-200'd into the 756KB app shell — crawl waste and
# soft-404s in Search Console. Physical guide pages always win over these
# non-forced rules, so all 12k real pages are unaffected.
[[redirects]]
  from = "/matchup/*"
  to = "/404.html"
  status = 404

# Don't serve backend-only / internal files even though they live in the repo
# root (publish = "." ships everything). These MUST be force = true: without it
# Netlify serves the real file whenever one exists, so these rules never fired
# and https://matchupcoach.gg/server.js returned the backend source with a 200.
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/render.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/server-data/*"
  to = "/404.html"
  status = 404
  force = true
# Build scripts, audits and working datasets all live at the root with a leading
# underscore — none of them should be publicly readable.
[[redirects]]
  from = "/_*"
  to = "/404.html"
  status = 404
  force = true
# Internal working notes (content-pipeline resume files) — not for the public.
[[redirects]]
  from = "/RESUME-*"
  to = "/404.html"
  status = 404
  force = true
