# Render blueprint — creates the MatchupCoach web service from this repo.
# In Render: New + > Blueprint > pick this repo, and it reads this file.
# The starter plan + 1GB disk (~$7.25/mo total) is required so accounts and
# the founder counter PERSIST — free instances wipe their disk on every
# restart/deploy, which would reset all users.
services:
  - type: web
    name: matchupcoach
    runtime: node
    plan: starter
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: matchupcoach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PAYMENTS_MODE
        value: "demo"  # simulated checkout until Stripe keys are set (access is PAID-gated now — 'off' would lock everyone out)
      - key: GOOGLE_CLIENT_ID
        # Public OAuth web-client id (Google Cloud project "MatchupCoach") —
        # safe to commit; the client SECRET is never used or stored anywhere.
        value: "993471719983-g8fkkrqom5ap0f7pdf7tkg63v86d77l4.apps.googleusercontent.com"
      # --- Stripe (real payments). Add these in the Render dashboard, NOT here
      #     (the secret key must never be committed to git). When STRIPE_SECRET_KEY
      #     is set, checkout hands off to Stripe's hosted page for real charges.
      - key: STRIPE_SECRET_KEY
        sync: false            # set in Render dashboard: sk_live_… (or sk_test_… to trial)
      - key: STRIPE_PRICE_FOUNDING
        sync: false            # $1.99/mo price id — now the LANE PASS price (name kept so the existing Render env works)
      - key: STRIPE_PRICE_STANDARD
        sync: false            # $3.99/mo price id — now the ALL-LANES monthly price
      - key: STRIPE_PRICE_ALLYR
        sync: false            # $24.99/yr all-lanes annual price id (price_…)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false            # whsec_… from the webhook endpoint's "Signing secret".
                               # Without it a buyer who closes the tab before returning
                               # is charged with no access, and cancellations never revoke.
      - key: PUBLIC_URL
        value: "https://matchupcoach.gg"
      - key: ADMIN_USERS
        value: "kristopher"   # comma-separated user keys allowed to delete any matchup note
