# Netlify config for the MatchupCoach STATIC frontend.
# Netlify can't run server.js (the Node API), so we PROXY every /api/* request
# to the Render backend. The browser still calls same-origin /api (api-client.js
# uses BASE = '/api'), so accounts + Google sign-in work with no CORS changes.
#
# IMPORTANT: replace the host below with YOUR actual Render service URL
# (Render dashboard → your "matchupcoach" service → the .onrender.com URL).

[build]
  publish = "."
  # Regenerate the ~9,600 static matchup guide pages + sitemap.xml from the
  # current champion data on every deploy. They are gitignored (115MB) so the
  # repo stays lean and the pages can never drift from the data they describe.
  # If this command fails the deploy fails and the previous site stays live.
  command = "node _gen_seo_pages.js"

# ALWAYS-FRESH CACHING: the app is one big HTML file + hundreds of champ-data
# scripts with no version query. Without explicit headers, browsers heuristically
# cache them for days — users kept seeing old builds after deploys ("the fix
# didn't work"). max-age=0 + must-revalidate forces a cheap ETag check on every
# load, so each deploy reaches everyone immediately (304s when nothing changed).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Clickjacking + MIME-sniffing protection for the static pages (the API
    # already sets both from server.js; Netlify sends neither by default).
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # Send the full URL only to matchupcoach.gg itself; cross-origin requests
    # (the Data Dragon images, Stripe's hosted checkout, any outbound click)
    # get the bare origin. Browsers that ignore it fall back to their own
    # default, which is already this value in every current browser.
    # Deliberately NOT set here: Content-Security-Policy — the app is one HTML
    # file of inline scripts plus CDN dependencies, so any honest policy would
    # need 'unsafe-inline' and would protect nothing while risking a blank site.
    # Also deliberately not set: HSTS includeSubDomains — the API runs on a
    # different host and other subdomains are not all HTTPS-only, so the flag
    # would promise something this deploy does not control.
    Referrer-Policy = "strict-origin-when-cross-origin"

# The self-healing build stamp must never be cached — it's how a stale page
# learns a new build shipped and reloads itself.
[[headers]]
  for = "/build.txt"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Netlify has no built-in type for .webmanifest, so it shipped as
# application/octet-stream and browsers ignored the install metadata.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Proxy the API to the Render backend (200 = rewrite/proxy, not a redirect).
[[redirects]]
  from = "/api/*"
  to = "https://matchupcoach.onrender.com/api/:splat"
  status = 200
  force = true

# Serve the app at the root URL. force = true is REQUIRED: the physical
# index.html otherwise wins and its meta-refresh hop DROPS the query string —
# which silently killed the Stripe success return (?mc_checkout=success&
# session_id=…) in production, leaving buyers dependent on webhook latency
# for their access. With the rewrite forced, the app loads at / with the
# query intact and the confirm path runs. (The app's <head> carries its own
# canonical + JSON-LD, so shadowing index.html loses nothing.)
[[redirects]]
  from = "/"
  to = "/MatchupCoach.dc.html"
  status = 200
  force = true

# ONE URL FOR THE HOMEPAGE. Three other URLs served or reached the same document:
# /index.html (the physical meta-refresh stub), /MatchupCoach.dc.html (which
# Netlify pretty-URLs down to the lowercase extensionless form) and
# /matchupcoach.dc itself. All three carried canonical https://matchupcoach.gg/,
# so nothing was mis-indexed, but each was a crawlable duplicate of the domain's
# strongest URL. Send them all to / for good. force = true is REQUIRED on each:
# a real file is served at every one of these paths, and without force Netlify
# serves the file and the rule never fires. The rewrite above is unaffected —
# Netlify matches the redirect rules against the INCOMING request only and never
# re-runs them on a rewrite's destination (the same reason the standard
# "/* -> /index.html 200" SPA fallback does not loop), so / still rewrites to
# MatchupCoach.dc.html with the query string intact.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/MatchupCoach.dc.html"
  to = "/"
  status = 301
  force = true
# Same file, lowercased: Netlify normalises asset paths to lower case, which is
# why the live 301 from /MatchupCoach.dc.html landed on /matchupcoach.dc. Cover
# both the lowercase .html spelling and the extensionless pretty URL.
[[redirects]]
  from = "/matchupcoach.dc.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/matchupcoach.dc"
  to = "/"
  status = 301
  force = true

# Matchup deep links (/matchup/a-vs-b and /matchup/leagueoflegends/lol/a-vs-b)
# load the app, which reads the path and opens that matchup (_openFromUrl).
# Without this every shared/sitemap matchup URL 404'd on Netlify — only the
# Node server had the SPA fallback. Static files under /matchup/ still win
# (Netlify only applies a non-forced redirect when no file matches).
# App routes stay SPA: /open deep links (lane-aware and legacy lane-less) and
# old /matchup/leagueoflegends/lol/ links load the app, which opens the matchup.
[[redirects]]
  from = "/matchup/:lane/:slug/open"
  to = "/MatchupCoach.dc.html"
  status = 200
[[redirects]]
  from = "/matchup/:slug/open"
  to = "/MatchupCoach.dc.html"
  status = 200
[[redirects]]
  from = "/matchup/leagueoflegends/lol/*"
  to = "/MatchupCoach.dc.html"
  status = 200
# Account page (plan, billing, cancel, change plan). The app reads the path
# (_openFromUrl) and opens the Account view; signed-out visitors get sign-in
# first. cancel.html's "Sign in and cancel" button links here.
[[redirects]]
  from = "/account"
  to = "/MatchupCoach.dc.html"
  status = 200
# Legacy lane-less shared links (/matchup/a-vs-b) no longer serve the app shell
# at their own URL. They used to (status = 200), which meant EVERY one-segment
# path under /matchup/ — /matchup/foo just as much as a real pair — answered 200
# with the 787 KB homepage shell canonicalised to /. That is an unbounded space
# of crawlable soft-404s and duplicates of the homepage.
# Now the URL 301s to the /open deep link instead. The app resolves /open exactly
# as it resolved the lane-less path (_openFromUrl reads either shape), so every
# old shared link still opens its matchup — and robots.txt already disallows
# /matchup/*/open, so the shell is no longer reachable by a crawler at all: the
# 301 destination is blocked, so the source URL is dropped rather than indexed as
# another copy of the homepage. Lane hubs (/matchup/top/) and /matchup/ itself are
# real files and win over this non-forced rule, so they are untouched.
# KNOWN LIMIT: this fires for any one-segment path, not only "a-vs-b" pairs.
# Netlify's matcher cannot test a substring inside a path segment — verified
# against netlify-redirector: "/matchup/:a-vs-:b" silently degrades to
# "/matchup/:a" (it matched /matchup/foo) and "/matchup/*-vs-*" never matches at
# all. Sending only real pairs here and letting everything else fall through to
# the 404 below needs one literal rule per pair, i.e. a generated _redirects file
# from _gen_seo_pages.js. Until that exists, a junk lane-less URL lands on a
# robots-disallowed /open rather than a 404 — no longer a crawlable 200.
[[redirects]]
  from = "/matchup/:slug"
  to = "/matchup/:slug/open"
  status = 301
# …but any other unknown matchup URL is a REAL 404 now. Without this, every
# nonexistent guide URL soft-200'd into the 756KB app shell — crawl waste and
# soft-404s in Search Console. Physical guide pages always win over these
# non-forced rules, so all 12k real pages are unaffected.
# Three mid pages (fizz/ekko/irelia vs Locke) shipped as "no data exists yet"
# placeholders and were indexed; the generator now skips placeholder entries,
# so send each old URL to its champion hub instead of a 404 (non-forced: if a real page ever exists, it wins).
[[redirects]]
  from = "/matchup/mid/fizz-vs-locke/"
  to = "/matchup/mid/fizz/"
  status = 301
[[redirects]]
  from = "/matchup/mid/ekko-vs-locke/"
  to = "/matchup/mid/ekko/"
  status = 301
[[redirects]]
  from = "/matchup/mid/irelia-vs-locke/"
  to = "/matchup/mid/irelia/"
  status = 301

[[redirects]]
  from = "/matchup/*"
  to = "/404.html"
  status = 404

# ONE URL PER LEGAL PAGE. Netlify already answers /terms from terms.html, so both
# spellings returned 200 and Google was free to index either one — two URLs, one
# page, split signals. Send the .html spelling to the clean one for good. These MUST
# be force = true for the same reason as the block below: without it Netlify serves
# the real file whenever one exists and the rule never fires. The clean URL does not
# match these rules, so there is no loop.
[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true
[[redirects]]
  from = "/refund.html"
  to = "/refund"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/cookies.html"
  to = "/cookies"
  status = 301
  force = true
[[redirects]]
  from = "/cancel.html"
  to = "/cancel"
  status = 301
  force = true
[[redirects]]
  from = "/methodology.html"
  to = "/methodology"
  status = 301
  force = true

# Don't serve backend-only / internal files even though they live in the repo
# root (publish = "." ships everything). These MUST be force = true: without it
# Netlify serves the real file whenever one exists, so these rules never fired
# and https://matchupcoach.gg/server.js returned the backend source with a 200.
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/render.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/server-data/*"
  to = "/404.html"
  status = 404
  force = true
# Build scripts, audits and working datasets all live at the root with a leading
# underscore — none of them should be publicly readable.
[[redirects]]
  from = "/_*"
  to = "/404.html"
  status = 404
  force = true
# Internal working notes (content-pipeline resume files) — not for the public.
[[redirects]]
  from = "/RESUME-*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/PICKUP-*"
  to = "/404.html"
  status = 404
  force = true
